server {
    listen 80;
    server_name meguim.com www.meguim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name meguim.com www.meguim.com;

    ssl_certificate /etc/letsencrypt/live/meguim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meguim.com/privkey.pem;

    root /var/www/meguhome;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    location /archwizardcollection/ {
        alias /var/www/meguhome/archwizardcollection/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
