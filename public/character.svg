<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <!-- Hair back -->
  <ellipse cx="150" cy="108" rx="72" ry="78" fill="#1a1a2e"/>

  <!-- Neck -->
  <rect x="132" y="175" width="36" height="30" rx="8" fill="#FFD6B0" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Body / outfit -->
  <ellipse cx="150" cy="295" rx="85" ry="100" fill="#FF6B6B" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Collar -->
  <path d="M 118 198 Q 150 220 182 198" fill="#FFE66D" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- Arms -->
  <ellipse cx="68" cy="285" rx="22" ry="55" fill="#FF6B6B" stroke="#1a1a2e" stroke-width="3" transform="rotate(-8 68 285)"/>
  <ellipse cx="232" cy="285" rx="22" ry="55" fill="#FF6B6B" stroke="#1a1a2e" stroke-width="3" transform="rotate(8 232 285)"/>

  <!-- Hands -->
  <ellipse cx="58" cy="338" rx="18" ry="16" fill="#FFD6B0" stroke="#1a1a2e" stroke-width="2.5"/>
  <ellipse cx="242" cy="338" rx="18" ry="16" fill="#FFD6B0" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- Head -->
  <ellipse cx="150" cy="115" rx="68" ry="72" fill="#FFD6B0" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Hair front -->
  <path d="M 82 95 Q 88 40 150 38 Q 212 40 218 95 Q 200 60 150 58 Q 100 60 82 95 Z" fill="#1a1a2e"/>
  <!-- Side bangs -->
  <path d="M 82 95 Q 72 110 78 135 Q 85 105 95 100 Z" fill="#1a1a2e"/>
  <path d="M 218 95 Q 228 110 222 135 Q 215 105 205 100 Z" fill="#1a1a2e"/>

  <!-- Eyes -->
  <ellipse cx="122" cy="118" rx="12" ry="13" fill="white" stroke="#1a1a2e" stroke-width="2"/>
  <ellipse cx="178" cy="118" rx="12" ry="13" fill="white" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="125" cy="120" r="7" fill="#1a1a2e"/>
  <circle cx="181" cy="120" r="7" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <circle cx="127" cy="117" r="2.5" fill="white"/>
  <circle cx="183" cy="117" r="2.5" fill="white"/>

  <!-- Blush -->
  <ellipse cx="104" cy="138" rx="14" ry="8" fill="#FF6B6B" opacity="0.4"/>
  <ellipse cx="196" cy="138" rx="14" ry="8" fill="#FF6B6B" opacity="0.4"/>

  <!-- Mouth -->
  <path d="M 138 150 Q 150 162 162 150" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Pocket / detail on outfit -->
  <rect x="128" y="255" width="44" height="36" rx="8" fill="#FFE66D" stroke="#1a1a2e" stroke-width="2.5"/>
  <circle cx="150" cy="273" r="6" fill="#4ECDC4" stroke="#1a1a2e" stroke-width="2"/>
</svg>
